openapi: 3.1.0
info:
  title: ChocoMarket API
  version: 1.0.0
  description: |
    Contrato inicial da API da ChocoMarket, focado nos recursos users, products e orders.

    O cadastro público cria somente clientes. Administradores são criados
    inicialmente por seed e, futuramente, poderão ser gerenciados por um
    painel interno.

servers:
  - url: https://api.chocomarket.com
    description: Produção
  - url: http://localhost:3000
    description: Desenvolvimento local

tags:
  - name: Users
    description: Cadastro e gerenciamento de usuários
  - name: Products
    description: Catálogo e estoque de produtos
  - name: Orders
    description: Compras e pedidos

paths:
  /v1/users:
    post:
      tags:
        - Users
      summary: Cria um cliente
      description: |
        O cadastro público sempre cria um usuário com role `customer` e
        status `active`. Os campos `role`, `status` e `password_hash` não são
        aceitos no corpo da requisição.
      operationId: createCustomer
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            example:
              name: Ana Souza
              email: ana@example.com
              password: UmaSenhaSeguraCom12Caracteres
      responses:
        '201':
          description: Cliente criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Já existe um usuário com esse e-mail ou a chave de idempotência foi reutilizada com outro conteúdo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Users
      summary: Lista usuários
      description: |
        Operação administrativa. Por padrão, lista somente usuários ativos.
        Administradores podem usar `status=inactive` para localizar usuários
        desativados e reativá-los.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Filtra por nome, usando correspondência textual.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: email
          in: query
          description: Filtra por e-mail.
          schema:
            type: string
            format: email
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          description: O padrão é `active`.
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Página de usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Consulta um usuário
      description: |
        Clientes podem consultar somente o próprio perfil ativo.
        Administradores podem consultar qualquer usuário, inclusive inativo.
      operationId: getUser
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

    patch:
      tags:
        - Users
      summary: Atualiza um usuário
      description: |
        Clientes podem alterar `name` e `email` do próprio perfil.
        Administradores também podem alterar `role` e `status`, incluindo
        reativar um usuário com `status=active`.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              customerUpdate:
                summary: Atualização feita pelo próprio cliente
                value:
                  name: Ana Souza Atualizada
                  email: ana.nova@example.com
              adminReactivation:
                summary: Reativação feita por administrador
                value:
                  status: active
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O e-mail informado já está em uso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

    delete:
      tags:
        - Users
      summary: Desativa um usuário
      description: |
        Exclusão lógica. O registro permanece armazenado para preservar o
        histórico de compras, mas seu status muda para `inactive`.

        O próprio cliente pode desativar sua conta. Administradores podem
        desativar outros usuários. Repetir a operação é seguro e continua
        retornando sucesso.
      operationId: deactivateUser
      responses:
        '204':
          description: Usuário desativado ou já inativo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
        - Users
      summary: Altera a senha de um usuário
      description: |
        O cliente pode alterar a própria senha informando a senha atual.
        A senha nunca é retornada pela API.
      operationId: changeUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: SenhaAtualCom12Caracteres
              new_password: NovaSenhaSeguraCom12Caracteres
      responses:
        '204':
          description: Senha alterada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/products:
    get:
      tags:
        - Products
      summary: Lista produtos
      description: |
        Clientes visualizam somente produtos com status `active`.
        Administradores podem consultar produtos ativos, inativos e sem
        estoque usando o filtro `status`.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Filtra por nome, usando correspondência textual.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: min_price_cents
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
        - name: max_price_cents
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
        - name: status
          in: query
          description: Clientes só podem consultar o valor `active`.
          schema:
            $ref: '#/components/schemas/ProductStatus'
      responses:
        '200':
          description: Página de produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - {}
        - bearerAuth: []

    post:
      tags:
        - Products
      summary: Cria um produto
      description: |
        Operação administrativa. O status é calculado pelo backend:
        estoque maior que zero cria um produto `active`; estoque igual a zero
        cria um produto `out_of_stock`.
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: Chocolate amargo 70%
              description: Chocolate com alto teor de cacau.
              price_cents: 1590
              stock_quantity: 25
      responses:
        '201':
          description: Produto criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A chave de idempotência foi reutilizada com outro conteúdo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags:
        - Products
      summary: Consulta um produto
      description: |
        Clientes só podem consultar produtos ativos. Administradores podem
        consultar qualquer produto, inclusive inativo ou sem estoque.
      operationId: getProduct
      responses:
        '200':
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - {}
        - bearerAuth: []

    patch:
      tags:
        - Products
      summary: Atualiza parcialmente um produto
      description: |
        Operação administrativa. Campos ausentes permanecem inalterados.
        Quando `stock_quantity` for zero, o backend define status
        `out_of_stock` automaticamente.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            example:
              stock_quantity: 0
      responses:
        '200':
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

    delete:
      tags:
        - Products
      summary: Desativa um produto
      description: |
        Exclusão lógica. O produto permanece armazenado para preservar as
        referências em pedidos existentes e passa a ter status `inactive`.
      operationId: deactivateProduct
      responses:
        '204':
          description: Produto desativado ou já inativo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/orders:
    get:
      tags:
        - Orders
      summary: Lista pedidos
      description: |
        Clientes consultam somente os próprios pedidos. Administradores podem
        consultar todos e filtrar por `user_id`.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: user_id
          in: query
          description: Disponível somente para administradores.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Orders
      summary: Cria um pedido
      description: |
        O cliente envia produtos e quantidades. O backend identifica o
        usuário pelo token, consulta os preços atuais, calcula os subtotais e
        o total, valida o estoque, cria o pedido e reduz o estoque em uma
        única transação.

        O pedido nasce com status `confirmed`, que representa a compra
        concluída nesta versão da API. Não há fluxo de pagamento separado.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
                - product_id: 7f8e9d0c-1b2a-4c3d-8e9f-0a1b2c3d4e5f
                  quantity: 2
      responses:
        '201':
          description: Pedido criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Somente clientes criam pedidos; administradores recebem 403.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Estoque insuficiente, produto indisponível ou chave de
            idempotência reutilizada com outro conteúdo. Nenhum pedido é
            criado e nenhum estoque é alterado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      summary: Consulta um pedido
      description: |
        Clientes podem consultar somente os próprios pedidos. Administradores
        podem consultar qualquer pedido, inclusive cancelado.
      operationId: getOrder
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

  /v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Orders
      summary: Cancela um pedido
      description: |
        O cliente pode cancelar o próprio pedido e o administrador pode
        cancelar qualquer pedido. O estoque dos itens é devolvido na mesma
        transação. Repetir a operação em um pedido já cancelado retorna o
        pedido cancelado sem devolver o estoque novamente.
      operationId: cancelOrder
      responses:
        '200':
          description: Pedido cancelado ou já cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: O pedido não pode ser cancelado no estado atual.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso enviado no header Authorization.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador único do usuário.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: Identificador único do produto.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador único do pedido.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Quantidade máxima de itens na página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco retornado em `meta.next_cursor`.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chave única para permitir retry seguro da criação. Para a mesma chave
        e o mesmo conteúdo, o servidor deve repetir a resposta original.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave única e estável para permitir retry seguro da criação do pedido.
        A mesma chave com o mesmo conteúdo deve repetir a resposta original.
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    Location:
      description: URL do recurso criado, relativa à raiz da API.
      schema:
        type: string
        format: uri-reference

  responses:
    BadRequest:
      description: Requisição malformada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token ausente, inválido ou conta inativa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Usuário autenticado sem permissão para a operação.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Usuário inexistente ou não disponível para a consulta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Um ou mais campos não passaram na validação.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    UserRole:
      type: string
      enum:
        - customer
        - admin
    UserStatus:
      type: string
      enum:
        - active
        - inactive

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          description: E-mail normalizado para minúsculas.
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 8d7f0d2c-2ca5-4db4-bf32-7b6f2f8f6e1d
        name: Ana Souza
        email: ana@example.com
        role: customer
        status: active
        created_at: '2026-10-30T12:00:00Z'
        updated_at: '2026-10-30T12:00:00Z'

    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
      description: |
        `role` e `status` só podem ser alterados por administradores. Clientes
        só podem alterar `name` e `email` do próprio perfil.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    PageMeta:
      type: object
      additionalProperties: false
      required:
        - limit
        - next_cursor
        - has_next
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
            - string
            - 'null'
        has_next:
          type: boolean

    UserPage:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'

    ProductStatus:
      type: string
      enum:
        - active
        - inactive
        - out_of_stock

    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - price_cents
        - stock_quantity
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        price_cents:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Preço em centavos. 1590 representa R$ 15,90.
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        status:
          $ref: '#/components/schemas/ProductStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 7f8e9d0c-1b2a-4c3d-8e9f-0a1b2c3d4e5f
        name: Chocolate amargo 70%
        description: Chocolate com alto teor de cacau.
        price_cents: 1590
        stock_quantity: 25
        status: active
        created_at: '2026-10-30T12:00:00Z'
        updated_at: '2026-10-30T12:00:00Z'

    CreateProductRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - price_cents
        - stock_quantity
      properties:
        name:
          type: string
          minLength: 1
