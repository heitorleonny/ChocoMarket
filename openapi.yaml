    ValidationProblem:
      description: |
        Problem com a lista de erros por campo. Os campos de `Problem` são
        repetidos aqui porque `additionalProperties: false` em `Problem`
        impediria a composição por `allOf` de aceitar `errors`.
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - code
        - request_id
        - errors
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica o tipo do problema.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
          description: Identificador para correlação com os logs.
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
